name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
      # setup-node + registry-url writes a placeholder _authToken that makes
      # npm prefer bearer auth over OIDC and fail publish with E404.
      - name: Prepare npm for trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          fi
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Version & publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
