name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC publishing (Trusted Publisher) only works once the package
      # exists on npmjs.com with a trusted-publisher connection. The runner
      # resolves the Node-bundled npm (10.x) first, so put the freshly
      # installed global npm (>= 11.5.1, required for OIDC) ahead on PATH.
      - name: Prepare npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"
          fi
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Version & publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
